spring.application.name=pedidosBackend

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always
#testdfgd
# Configuración de Base de Datos leyendo variables de entorno
spring.datasource.url=jdbc:mysql://${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

springdoc.swagger-ui.path=/productos.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha

server.port=2020