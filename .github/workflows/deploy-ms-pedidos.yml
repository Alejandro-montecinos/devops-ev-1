name: Deploy ms-pedidos a EC2

# Este archivo debe vivir en la RAIZ del repo: <raiz-del-repo>/.github/workflows/deploy-ms-pedidos.yml
# (junto a las carpetas de cada microservicio, ej. ms-pedidos/, y a futuro ms-usuarios/, etc.)
# GitHub solo lee workfldows en .github/workflows/ de la raiz del repo, nunca dentro de una subcarpeta.


on:
  push:
    branches: [main]
    paths:
      - 'pedidosBackend/**'
      - '.github/workflows/deploy-ms-pedidos.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: pedidosBackend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ejecutar tests y generar reporte JaCoCo
        run: |
          chmod +x mvnw
          ./mvnw -B test jacoco:report -Dspring.profiles.active=test

      - name: Subir reporte de cobertura JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: pedidosBackend/target/site/jacoco/
          if-no-files-found: warn

      - name: Compilar con el Maven Wrapper
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ./mvnw -B clean package -DskipTests

      - name: Copiar el jar a la instancia EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: 'pedidosBackend/target/pedidosBackend-0.0.1-SNAPSHOT.jar'
          target: '/home/${{ secrets.EC2_USER }}/micros'
          strip_components: 2

      - name: Reiniciar el servicio
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo systemctl restart ms-pedidos
            sudo systemctl status ms-pedidos --no-pager